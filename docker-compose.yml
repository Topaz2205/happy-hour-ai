services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: happyhour
      POSTGRES_USER: happyhour
      POSTGRES_PASSWORD: happyhour
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happyhour -d happyhour"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+asyncpg://happyhour:happyhour@postgres:5432/happyhour

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  postgres_data:
